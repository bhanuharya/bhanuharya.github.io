---
layout: default
---
<article class="page">
  <header class="page-head win">
    {% if page.floor %}<div class="floor-tag">{{ page.floor }}</div>{% endif %}
    <h1>{{ page.title | escape }}</h1>
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </header>
  {% if page.bare %}
  {{ content }}
  {% else %}
  <div class="win prose-win">
    <div class="page-content">
      {{ content }}
    </div>
  </div>
  {% endif %}
</article>
