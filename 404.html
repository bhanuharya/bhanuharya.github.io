---
layout: default
title: "Not found"
permalink: /404.html
---
<div class="dialog raised msgbox" role="alertdialog" aria-labelledby="nf-title" aria-describedby="nf-text">
  <div class="dialog-title"><span id="nf-title">Packet Capture</span><span class="caption-btns" aria-hidden="true"><i>×</i></span></div>
  <div class="dialog-body">
    <div class="msg">
      <span class="msg-icon" aria-hidden="true">×</span>
      <div id="nf-text">
        <h1 class="visually-hidden">Not found</h1>
        <p>No packets matched the display filter:</p>
        <p><code id="nf-filter">http.request.uri == "this page"</code></p>
        <p class="dim">It may have moved, or never existed.</p>
      </div>
    </div>
    <div class="dialog-buttons"><a class="btn" href="{{ '/' | relative_url }}">OK</a></div>
  </div>
</div>
<script>
  (function () {
    var f = document.getElementById('nf-filter');
    if (f) f.textContent = 'http.request.uri == "' + window.location.pathname + '"';
  })();
</script>
