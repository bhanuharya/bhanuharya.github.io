---
layout: default
---
<article class="page">
  {% if page.title %}
    <h1 class="page-title">{{ page.title | escape }}</h1>
  {% endif %}
  <div class="page-content">
    {{ content }}
  </div>
  <nav class="post-nav" aria-label="Page navigation">
    <a href="{{ '/' | relative_url }}">&larr; back to home</a>
    <a href="{{ '/blog/' | relative_url }}">blog</a>
  </nav>
</article>
