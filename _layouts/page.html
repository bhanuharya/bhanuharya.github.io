---
layout: default
---
<article class="page">
  <header class="panel page-head">
    <div>
      {% if page.kicker %}<div class="kicker">{{ page.kicker }}</div>{% endif %}
      <h1>{{ page.title | escape }}</h1>
      {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    </div>
    {% if page.sigil %}<span class="sigil sigil--lg" data-sigil="{{ page.sigil }}" aria-hidden="true"></span>{% endif %}
  </header>
  {% if page.bare %}
  {{ content }}
  {% else %}
  <div class="panel reading">
    <div class="page-content">
      {{ content }}
    </div>
  </div>
  {% endif %}
</article>
