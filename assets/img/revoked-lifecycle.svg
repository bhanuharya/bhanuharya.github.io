<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#ffffff"/>

  <text x="10" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b1b1b">What the word "revoked" hides</text>

  <rect x="205" y="36" width="150" height="42" rx="8" fill="#fff7e8" stroke="#d1570d" stroke-width="1.3"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1b1b1b" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="280" y="62">stop requested</text>
  </g>

  <g fill="none" stroke="#555555" stroke-width="1.5">
    <path d="M280,78 L280,100" marker-end="url(#arw)"/>
  </g>

  <path d="M76,100 L484,100" fill="none" stroke="#555555" stroke-width="1.5"/>
  <g fill="none" stroke="#555555" stroke-width="1.5">
    <path d="M76,100 L76,114"/>
    <path d="M212,100 L212,114"/>
    <path d="M348,100 L348,114"/>
    <path d="M484,100 L484,114"/>
  </g>

  <rect x="15" y="114" width="122" height="66" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>
  <rect x="151" y="114" width="122" height="66" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>
  <rect x="287" y="114" width="122" height="66" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>
  <rect x="423" y="114" width="122" height="66" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1b1b1b" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="76" y="140">admission</text>
    <text x="212" y="140">credential</text>
    <text x="348" y="140">sessions</text>
    <text x="484" y="140">cleanup</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#6b6b6b" font-size="11" text-anchor="middle">
    <text x="76" y="159">closed</text>
    <text x="212" y="159">rejected</text>
    <text x="348" y="159">gone seen</text>
    <text x="484" y="159">accounted</text>
  </g>

  <g fill="none" stroke="#555555" stroke-width="1.5">
    <path d="M76,180 L76,196"/>
    <path d="M212,180 L212,196"/>
    <path d="M348,180 L348,196"/>
    <path d="M484,180 L484,196"/>
  </g>
  <path d="M76,196 L484,196" fill="none" stroke="#555555" stroke-width="1.5"/>
  <path d="M280,196 L280,216" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="110" y="216" width="340" height="64" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="7 5"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#c0392b" font-size="11.5" text-anchor="middle">
    <text x="280" y="242">a query admitted before the first box</text>
    <text x="280" y="260">can still deliver a result down here</text>
  </g>

  <text x="10" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b6b6b">one status word, four separate events. late effects land in the last box.</text>
</svg>
