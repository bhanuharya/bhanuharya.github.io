---
layout: default
---
<article class="dialog raised">
  <div class="dialog-title"><span>{{ page.title | escape }}</span><span class="caption-btns" aria-hidden="true"><i>×</i></span></div>
  <div class="dialog-body">
    <div class="text-area sunken">
      <h1 class="page-title">{{ page.title | escape }}</h1>
      <div class="page-content">
        {{ content }}
      </div>
    </div>
    <div class="dialog-buttons"><a class="btn" href="{{ '/' | relative_url }}">Close</a></div>
  </div>
</article>
