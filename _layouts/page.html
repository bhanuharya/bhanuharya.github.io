---
layout: default
---
{%- comment -%} a plain page opens in the Browser, like a post {%- endcomment -%}
{%- assign btitle = page.title | append: ' - Browser' -%}
<section class="window win-app" data-app="browser" data-title="{{ btitle | escape }}" aria-labelledby="pg-title">
  {% include browser-top.html title=btitle url=page.url %}
  <div class="win-body page-view sunken" tabindex="-1">
    <article class="page-doc">
      <h1 id="pg-title">{{ page.title | escape }}</h1>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </div>
  <div class="statusline"><span class="seg grow" data-status>Done</span><span class="seg">Internet</span></div>
</section>
