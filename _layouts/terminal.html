<!DOCTYPE html>
<html lang="en" data-term="green" data-crt="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>terminal · {{ site.title | escape }}</title>
  <meta name="description" content="An interactive terminal for Harya's notes. Type help to get started.">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}">
</head>
<body>
  <div class="crt" id="crt">
    <div class="screen" id="screen" role="log" aria-live="polite" aria-label="terminal output"></div>
    <div class="inputline" id="inputline">
      <span class="prompt" id="prompt"></span><span class="typed" id="typed"></span><span class="caret" id="caret"> </span>
    </div>
    <input class="keycatcher" id="keycatcher" type="text" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="terminal input" tabindex="-1">
  </div>

  <noscript>
    <p style="padding:16px">This page is an interactive terminal and needs JavaScript. The notes are at <a href="{{ '/blog/' | relative_url }}">/blog/</a>.</p>
  </noscript>

  <script>
    window.TERM_DATA = {
      site: {
        title: {{ site.title | jsonify }},
        author: {{ site.author | jsonify }},
        description: {{ site.description | strip_newlines | jsonify }}
      },
      posts: [
        {% for post in site.posts %}
        {
          title: {{ post.title | jsonify }},
          url: {{ post.url | relative_url | jsonify }},
          date: "{{ post.date | date: '%Y-%m-%d' }}",
          words: {{ post.content | number_of_words }},
          tags: {{ post.tags | jsonify }},
          excerpt: {{ post.excerpt | strip_html | strip_newlines | truncate: 200 | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    };
  </script>
  <script defer src="{{ '/assets/js/terminal-art.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/terminal.js' | relative_url }}"></script>
</body>
</html>
