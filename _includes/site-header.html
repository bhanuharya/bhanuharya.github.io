{%- comment -%} The website's own header, inside the Browser's page. include.here: home, about or post {%- endcomment -%}
<header class="site-head">
  <a class="site-name" href="{{ '/' | relative_url }}">Harya</a>
  <nav class="site-nav" aria-label="Site">
    <a href="{{ '/' | relative_url }}"{% if include.here == 'home' %} aria-current="page"{% endif %}>Posts</a>
    <a href="{{ '/about/' | relative_url }}"{% if include.here == 'about' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ '/feed.xml' | relative_url }}" data-ext>RSS</a>
    <button type="button" class="site-find" title="Search every post (/)" hidden>Search</button>
  </nav>
</header>
