<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#ffffff"/>

  <text x="10" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b1b1b">A stop acts at the door. The effect lands at the service.</text>

  <rect x="8" y="38" width="158" height="66" rx="8" fill="#fff7e8" stroke="#d1570d" stroke-width="1.3"/>
  <rect x="205" y="38" width="150" height="54" rx="8" fill="#fff7e8" stroke="#d1570d" stroke-width="1.3"/>
  <rect x="205" y="134" width="150" height="80" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.3"/>
  <rect x="390" y="142" width="162" height="56" rx="8" fill="#fff7e8" stroke="#d1570d" stroke-width="1.3"/>
  <rect x="205" y="330" width="150" height="60" rx="8" fill="#eefaf1" stroke="#1a7f37" stroke-width="1.3"/>
  <rect x="8" y="336" width="142" height="54" rx="8" fill="#f6f0ff" stroke="#8250df" stroke-width="1.3"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1b1b1b" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="87" y="61">agent sandbox</text>
    <text x="280" y="62">operator</text>
    <text x="280" y="158">gateway</text>
    <text x="471" y="165">issuer</text>
    <text x="280" y="354">service</text>
    <text x="79" y="359">observer</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#6b6b6b" font-size="11" text-anchor="middle">
    <text x="87" y="80">no network interface</text>
    <text x="87" y="96">two sockets</text>
    <text x="280" y="81">grant and deadline</text>
    <text x="280" y="177">host allowlist</text>
    <text x="280" y="193">method and path</text>
    <text x="280" y="209">allowlist, key swap</text>
    <text x="471" y="185">short-lived credential</text>
    <text x="280" y="374">the data the job reads</text>
    <text x="79" y="378">separate process</text>
  </g>

  <g fill="none" stroke="#555555" stroke-width="1.5">
    <path d="M280,92 L280,134" marker-end="url(#arw)"/>
    <path d="M166,66 C186,66 190,150 205,150" marker-end="url(#arw)"/>
    <path d="M280,214 L280,330" marker-end="url(#arw)"/>
    <path d="M408,198 C408,290 372,310 355,340" marker-end="url(#arw)"/>
  </g>
  <path d="M150,104 C150,250 170,320 205,348" fill="none" stroke="#c0392b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arwr)"/>
  <path d="M150,362 L205,362" fill="none" stroke="#6b6b6b" stroke-width="1.3" stroke-dasharray="2 4" marker-end="url(#arwg)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#6b6b6b" font-size="11">
    <text x="288" y="116">authorises</text>
    <text x="120" y="118">socket</text>
    <text x="288" y="268">permits</text>
    <text x="414" y="252">credential</text>
    <text x="152" y="356" font-size="10.5">watches</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#c0392b" font-size="11">
    <text x="168" y="238">direct attempt, run as a case</text>
    <text x="168" y="253">and it must fail</text>
  </g>

  <text x="10" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b6b6b">orange: actors. blue: the control point. dashed red: the case the lab runs.</text>
</svg>
